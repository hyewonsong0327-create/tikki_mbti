<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="극장 마을을 걷고, 극장을 짓고, 오디션을 열며 알아보는 나의 공연 MBTI! 16가지 관객 유형과 지금 볼 수 있는 공연을 추천해드려요.">
<meta property="og:title" content="틱키의 잃어버린 티켓 · 나의 공연 MBTI 게임">
<meta property="og:description" content="픽셀 극장 마을에서 티켓 조각을 모으며 알아보는 나의 공연 MBTI">
<meta property="og:type" content="website">
<meta name="theme-color" content="#5b21b6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AB%3C/text%3E%3C/svg%3E">
<title>틱키의 잃어버린 티켓 · 공연 MBTI 타이쿤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--p950:#12061f;--p900:#1a0b33;--p800:#2a1252;--p700:#5b21b6;--p600:#7c3aed;--p500:#8b5cf6;--p300:#c4b5fd;--p100:#ede9fe;
  --lime:#d9f99d;--mint:#6ee7b7;--pink:#f9a8d4;--gold:#fcd34d;--ink:#140726;--cream:#fffaf2;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{background:var(--p950)}
body{min-height:100vh;overflow-x:hidden}
body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 0%,rgba(124,58,237,.45),transparent 45%),radial-gradient(circle at 100% 100%,rgba(249,168,212,.15),transparent 40%),var(--p950)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pix{font-family:'Press Start 2P',monospace}
.jua{font-family:'Jua',sans-serif}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;padding:calc(10px + var(--st)) 12px calc(14px + var(--sb));position:relative}
.view{display:none}.view.on{display:block;animation:vin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes vin{from{opacity:0;transform:scale(.96) translateY(14px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-family:'Jua';font-size:19px;border:3px solid var(--ink);border-radius:14px;
  padding:13px 14px;cursor:pointer;background:var(--lime);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pu{background:var(--p600);color:#fff}.btn.wh{background:#fff}.btn.sm{font-size:15px;padding:9px 10px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--p700),6px 6px 0 3px var(--ink);padding:16px}

/* ===== INTRO ===== */
#intro{color:#fff;text-align:center;padding-top:10px}
.kicker{display:inline-block;font-family:'Press Start 2P';font-size:8px;background:var(--lime);color:var(--ink);border:2px solid var(--ink);
  padding:6px 8px;border-radius:6px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.title{font-family:'Jua';font-size:44px;line-height:1.05;margin:16px 0 4px;letter-spacing:-1px;
  text-shadow:0 4px 0 var(--p700),0 8px 0 var(--ink)}
.title span{color:var(--lime)}
.subt{font-family:'Jua';color:var(--p300);font-size:17px}
#introCv{width:100%;max-width:400px;aspect-ratio:4/3;margin:18px auto 14px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink)}
.dialog{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px 14px 12px;text-align:left;position:relative;min-height:96px;box-shadow:0 5px 0 var(--ink)}
.dialog .who{position:absolute;top:-14px;left:12px;background:var(--p600);color:#fff;font-family:'Jua';font-size:14px;padding:3px 10px;border:2px solid var(--ink);border-radius:8px}
.dialog p{font-family:'Jua';font-size:17px;line-height:1.5;min-height:52px}
.dialog .next{position:absolute;right:12px;bottom:8px;font-family:'Press Start 2P';font-size:9px;color:var(--p600);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}
.feat div{background:rgba(255,255,255,.06);border:2px dashed rgba(196,181,253,.4);border-radius:10px;padding:8px 2px;font-family:'Jua';font-size:12px;color:var(--p100)}
.feat b{display:block;font-size:20px;margin-bottom:2px}

/* ===== GAME ===== */
.hud{display:flex;align-items:center;gap:8px;color:#fff;margin-bottom:8px}
.slots{display:flex;gap:4px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 6px}
.slot{width:22px;height:16px;border:2px dashed rgba(255,255,255,.35);border-radius:3px}
.slot.got{border:2px solid var(--ink);background:var(--gold);box-shadow:inset 0 -3px 0 #f59e0b;animation:slotin .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes slotin{0%{transform:scale(2.4) rotate(-20deg)}100%{transform:none}}
.chipx{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 8px;font-family:'Press Start 2P';font-size:9px}
.chipx.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.25)}}
.hud .sp{flex:1}
.iconbtn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer}
.screen{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink),0 0 0 3px var(--p700) inset}
#cv{width:100%;height:auto;aspect-ratio:1/1;touch-action:none;cursor:pointer;background:#2a1252}
.zoneTip{position:absolute;left:50%;top:10px;transform:translateX(-50%) translateY(-60px);background:var(--ink);color:#fff;font-family:'Jua';font-size:14px;
  padding:6px 12px;border-radius:10px;border:2px solid var(--lime);transition:transform .3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;pointer-events:none}
.zoneTip.on{transform:translateX(-50%) translateY(0)}
.tut{position:absolute;inset:auto 10px 10px 10px;background:rgba(20,7,38,.88);color:#fff;border:2px solid var(--p300);border-radius:12px;padding:10px 12px;font-family:'Jua';font-size:14px;line-height:1.45;transition:opacity .4s}
.tut b{color:var(--lime)}
.mbti{display:flex;align-items:center;gap:8px;margin-top:12px;color:#fff}
.mbti .lbl{font-family:'Jua';font-size:14px;color:var(--p300);white-space:nowrap}
.letters{display:flex;gap:6px;flex:1}
.lt{flex:1;height:44px;perspective:300px}
.lt i{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.lt i b,.lt i em{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:10px;font-style:normal}
.lt i b{background:var(--p800);color:var(--p300);font-family:'Press Start 2P';font-size:14px;border-color:rgba(255,255,255,.3)}
.lt i em{background:var(--lime);color:var(--ink);transform:rotateY(180deg);font-family:'Press Start 2P';font-size:16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.lt.on i{transform:rotateY(180deg)}
.pad{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
.dpad{position:relative;width:138px;height:138px;flex:none}
.dpad button{position:absolute;width:46px;height:46px;border:3px solid var(--ink);background:var(--p300);border-radius:10px;box-shadow:0 4px 0 var(--ink);
  font-size:16px;color:var(--ink);cursor:pointer;touch-action:none}
.dpad button.hold{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--lime)}
.dpad .u{left:46px;top:0}.dpad .d{left:46px;top:92px}.dpad .l{left:0;top:46px}.dpad .r{left:92px;top:46px}
.dpad .c{left:46px;top:46px;background:var(--p700);pointer-events:none;box-shadow:none}
.side{flex:1;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.abtn{height:74px;border-radius:50%;width:74px;align-self:flex-end;font-family:'Press Start 2P';font-size:16px;background:var(--pink);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;color:var(--ink)}
.abtn.glow{animation:glow 1s infinite;background:var(--lime)}
@keyframes glow{50%{box-shadow:0 5px 0 var(--ink),0 0 0 8px rgba(217,249,157,.35)}}
.abtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hint{font-family:'Jua';color:var(--p300);font-size:13px;text-align:right;line-height:1.4}
.meter{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meter div{background:rgba(255,255,255,.06);border-radius:8px;padding:6px;text-align:center;font-family:'Jua';font-size:11px;color:var(--p300);border:2px solid rgba(255,255,255,.1)}
.meter div.done{border-color:var(--lime);color:#fff}

/* ===== MINIGAME MODAL ===== */
.mg{position:fixed;inset:0;z-index:50;background:rgba(10,4,24,.78);display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mg.on{display:flex}
.mgbox{width:100%;max-width:440px;max-height:calc(100vh - 28px);overflow:auto;background:var(--cream);border:3px solid var(--ink);border-radius:20px;
  box-shadow:0 8px 0 var(--ink);padding:16px;animation:mgin .5s cubic-bezier(.2,1.4,.4,1);position:relative}
@keyframes mgin{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.mgtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mgtop .tag{font-family:'Press Start 2P';font-size:8px;background:var(--p600);color:#fff;padding:5px 7px;border-radius:5px;border:2px solid var(--ink)}
.mgtop h3{font-family:'Jua';font-size:22px;flex:1}
.mgtop .x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink)}
.mgdesc{font-size:14px;line-height:1.5;color:#4c3d66;margin-bottom:12px}
.prog{display:flex;gap:5px;margin-bottom:12px}.prog i{flex:1;height:8px;border-radius:4px;background:#e4dcf5;border:2px solid var(--ink)}.prog i.f{background:var(--p500)}

/* tycoon */
.tyc{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#1a0b33}
.tyc canvas{width:100%;height:auto}
.tycstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tycstat div{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px;font-family:'Jua';font-size:13px;color:#5b4b77}
.tycstat b{display:block;font-family:'Press Start 2P';font-size:11px;color:var(--ink);margin-top:5px}
.budget{height:12px;border:2px solid var(--ink);border-radius:6px;background:#eee;overflow:hidden;margin-top:6px}.budget i{display:block;height:100%;background:var(--mint);transition:width .4s steps(8)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;gap:8px;align-items:center;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;cursor:pointer;box-shadow:0 3px 0 var(--ink);
  font-family:'Jua';font-size:14px;line-height:1.2;color:var(--ink);transition:transform .1s}
.item canvas{width:34px;height:34px;flex:none;border-radius:6px;background:var(--p100)}
.item small{display:block;font-family:'Gowun Dodum';font-size:11px;color:#6b5a86;margin-top:2px}
.item .cost{font-family:'Press Start 2P';font-size:8px;color:var(--p700);margin-top:4px;display:block}
.item.sel{background:var(--lime);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.item.no{opacity:.4}
.namein{width:100%;margin:10px 0;font-family:'Jua';font-size:17px;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;-webkit-user-select:text;user-select:text}

/* audition */
.auds{display:grid;grid-template-columns:1fr 1fr;gap:10px;perspective:800px}
.aud{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden;
  transition:transform .15s;transform-style:preserve-3d}
.aud .st{height:136px;border-radius:10px;background:linear-gradient(#2a1252,#5b21b6);position:relative;overflow:hidden;border:2px solid var(--ink)}
.aud .st:before{content:'';position:absolute;left:50%;top:-20px;width:120px;height:160px;transform:translateX(-50%);background:radial-gradient(ellipse at top,rgba(253,230,138,.55),transparent 70%)}
.aud .st canvas{position:absolute;left:50%;bottom:4px;width:54px;height:72px;transform:translateX(-50%);animation:perf .6s ease-in-out infinite alternate}
@keyframes perf{to{transform:translateX(-50%) translateY(-6px) rotate(3deg)}}
.aud .fx{position:absolute;font-size:16px;animation:fx 1.6s linear infinite;opacity:0}
@keyframes fx{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.2) rotate(20deg)}}
.aud .bub{position:absolute;top:8px;left:6px;right:6px;background:#fff;border:2px solid var(--ink);border-radius:8px;font-family:'Jua';font-size:11px;padding:3px 4px;animation:bub 1.8s infinite}
@keyframes bub{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.aud h4{font-family:'Jua';font-size:16px;margin:8px 0 2px}
.aud p{font-size:11.5px;color:#6b5a86;line-height:1.35}
.aud .pass{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Jua';font-size:30px;color:#e11d48;pointer-events:none;opacity:0}
.aud.win .pass{opacity:1;animation:stamp .5s cubic-bezier(.2,1.8,.4,1)}
.aud.win .pass span{border:4px solid #e11d48;border-radius:10px;padding:2px 10px;transform:rotate(-14deg);background:rgba(255,255,255,.85)}
@keyframes stamp{from{transform:scale(3);opacity:0}to{transform:none;opacity:1}}
.aud.lose{opacity:.35;transform:scale(.94)}

/* potion */
.pot{position:relative;display:flex;justify-content:center;margin:4px 0 10px}
.pot canvas{width:200px;height:auto}
.ings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ing{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-family:'Jua';font-size:13px;color:var(--ink)}
.ing:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ing canvas{width:40px;height:40px;margin:0 auto 4px}
.drops{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.drops i{width:22px;height:22px;border-radius:50%;border:2px dashed #b9a8d8}
.drops i.f{border:2px solid var(--ink);animation:slotin .5s cubic-bezier(.2,1.8,.4,1)}
.flyer{position:fixed;z-index:80;pointer-events:none;width:34px;height:34px}
.potname{text-align:center;font-family:'Jua';font-size:22px;margin:8px 0}

/* reaction */
.rscene{position:relative;height:170px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#1a0b33}
.rscene canvas{width:100%;height:100%}
.rq{font-family:'Jua';font-size:20px;text-align:center;margin:12px 0 8px;line-height:1.35;min-height:54px}
.timer{height:14px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#eee;margin-bottom:12px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#f43f5e,#fbbf24,#a3e635);width:100%}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rbtns .btn{font-size:16px;padding:14px 6px;line-height:1.3}

/* reward */
.reward{text-align:center;padding:10px 0}
.reward canvas{width:120px;height:auto;margin:0 auto;animation:spinY 1.6s ease-in-out infinite}
@keyframes spinY{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(360deg)}}
.reward h4{font-family:'Jua';font-size:24px;margin:10px 0 4px}
.reward p{font-size:14px;color:#4c3d66;line-height:1.55}
.reward .big{font-family:'Press Start 2P';font-size:30px;color:var(--p700);margin:10px 0;text-shadow:3px 3px 0 var(--lime)}

/* ===== FINALE / RESULT ===== */
.iris{position:fixed;inset:0;z-index:90;background:var(--ink);pointer-events:none;clip-path:circle(0% at 50% 50%)}
.iris.close{animation:irisc .7s ease-in forwards}.iris.open{animation:iriso .8s ease-out forwards}
@keyframes irisc{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
@keyframes iriso{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
.iris.full{clip-path:circle(150% at 50% 50%)}
.assemble{position:relative;height:300px;display:flex;align-items:center;justify-content:center}
.piece{position:absolute;width:90px;height:120px;border:3px solid var(--ink);background:var(--gold);box-shadow:inset 0 -6px 0 #f59e0b}
.assemble .msg{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#fff;font-family:'Jua';font-size:18px}

.ticketStage{perspective:1100px;margin:6px 0 4px}
.ticket{position:relative;border-radius:22px;transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
.ticket .tface{position:relative;border:3px solid var(--ink);border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#7c3aed,#4c1d95 60%,#2e1065);
  color:#fff;padding:18px 16px 16px;box-shadow:0 10px 0 var(--ink)}
.ticket .shine{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.35),transparent 45%);mix-blend-mode:overlay;pointer-events:none}
.ticket .holo{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(217,249,157,.18) 45%,rgba(249,168,212,.18) 55%,transparent 70%);
  background-size:250% 250%;animation:holo 4s linear infinite;pointer-events:none}
@keyframes holo{from{background-position:100% 0}to{background-position:-100% 0}}
.ticket .notch{position:absolute;top:58%;width:26px;height:26px;border-radius:50%;background:var(--p950);border:3px solid var(--ink)}
.ticket .notch.l{left:-15px}.ticket .notch.r{right:-15px}
.ticket .perf{position:absolute;left:18px;right:18px;top:calc(58% + 11px);border-top:3px dashed rgba(255,255,255,.35)}
.tk-top{display:flex;justify-content:space-between;font-family:'Press Start 2P';font-size:8px;color:var(--p300)}
.code{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.code span{width:58px;height:66px;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:26px;border:3px solid var(--ink);border-radius:12px;
  color:var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 var(--ink);animation:codein .6s cubic-bezier(.2,1.8,.4,1) both}
@keyframes codein{from{transform:translateY(-40px) rotate(-20deg) scale(.4);opacity:0}}
.tk-char{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:6px 0}
.tk-char canvas{width:96px;height:96px;animation:bob 1.5s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
@keyframes bob{50%{transform:translateY(-8px)}}
.tk-name{text-align:center;font-family:'Jua';font-size:24px;word-break:keep-all;line-height:1.15;text-shadow:0 3px 0 var(--ink)}
.tk-one{text-align:center;font-size:13.5px;color:var(--p100);margin-top:6px;line-height:1.5}
.tk-axes{display:grid;gap:7px;margin-top:30px}
.ax{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:6px;font-family:'Jua';font-size:12px}
.ax span:last-child{text-align:right}
.ax .tr{height:14px;border:2px solid var(--ink);border-radius:7px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
.ax .tr i{position:absolute;top:0;bottom:0;left:0;background:var(--lime);transition:width 1.2s cubic-bezier(.3,1.3,.5,1);width:0}
.ax .on{color:var(--lime)}
.tk-foot{display:flex;justify-content:space-between;margin-top:12px;font-family:'Press Start 2P';font-size:7px;color:var(--p300)}
.rsec{margin-top:18px}
.rhead{display:flex;align-items:center;gap:8px;color:#fff;font-family:'Jua';font-size:19px;margin-bottom:10px}
.rhead .pix{font-size:8px;background:var(--p600);padding:4px 6px;border-radius:4px;border:2px solid #fff}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-family:'Jua';font-size:14px;border:2px solid var(--ink);border-radius:20px;padding:4px 11px;background:#fff}
.kw span:nth-child(odd){background:var(--lime)}
.desc{font-size:14.5px;line-height:1.7;margin-top:10px}
.rec{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px dashed #d8cdee}
.rec:first-of-type{border-top:none}
.rec canvas{width:58px;height:58px;border:3px solid var(--ink);border-radius:10px;flex:none}
.rec b{font-family:'Jua';font-size:16px;display:block;line-height:1.25}
.rec small{display:block;font-size:12px;color:#6b5a86;margin-top:2px;line-height:1.4}
.gtag{display:inline-block;font-family:'Jua';font-size:11px;background:var(--p100);color:var(--p700);border:2px solid var(--ink);border-radius:10px;padding:1px 7px;margin-bottom:4px}
.tk-char canvas.hop{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(4px) scale(1.15,.85)}50%{transform:translateY(-34px) scale(.9,1.1) rotate(-8deg)}80%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
.say{position:fixed;z-index:96;pointer-events:none;font-family:'Jua';font-size:18px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;box-shadow:0 3px 0 var(--ink);animation:say 1.1s ease-out forwards;white-space:nowrap}
@keyframes say{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-30px) scale(1.1);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#introCv{cursor:pointer}
.rec img.poster{width:58px;height:80px;object-fit:cover;border:3px solid var(--ink);border-radius:10px;flex:none;background:#eee}
.rec small{display:block}
.rec a{font-family:'Jua';font-size:13px;color:var(--p700);text-decoration:none;display:inline-block;margin-top:4px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .card{text-align:center;padding:12px}
.match canvas{width:56px;height:56px;margin:4px auto}
.match small{font-family:'Press Start 2P';font-size:7px;color:var(--p700)}
.match b{display:block;font-family:'Jua';font-size:15px;line-height:1.25}
.match em{font-style:normal;font-family:'Press Start 2P';font-size:10px;display:block;margin-top:4px}
.log{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log div{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:10px;padding:9px;color:var(--p300);font-family:'Jua';font-size:12px}
.log b{display:block;color:#fff;font-size:15px;margin-top:3px;word-break:keep-all}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dex div{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 2px;text-align:center;cursor:pointer}
.dex div.me{background:var(--lime)}
.dex canvas{width:34px;height:34px;margin:0 auto}
.dex b{font-family:'Press Start 2P';font-size:7px;display:block;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.foot{color:var(--p300);text-align:center;font-size:11.5px;line-height:1.6;margin-top:20px}
.foot a{color:var(--lime)}
.toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translate(-50%,-120px);background:var(--ink);color:#fff;font-family:'Jua';font-size:15px;
  padding:10px 16px;border-radius:12px;border:2px solid var(--lime);z-index:99;transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:95;width:100%;height:100%}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(10,4,24,.7);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:460px;background:var(--cream);border:3px solid var(--ink);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + var(--sb));animation:up .35s cubic-bezier(.2,1.3,.4,1);max-height:80vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
</style>
</head>

  </div>
  <div class="mbti"><span class="lbl">나의 공연 MBTI</span>
    <div class="letters" id="letters"></div></div>
  <div class="pad">
    <div class="dpad" id="dpad"><button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button><span class="c"></span><button class="r" data-d="r">▶</button><button class="d" data-d="d">▼</button></div>
    <div class="side"><div class="hint" id="hint">탐험을 시작해 볼까요?<br>🪙 코인을 모으면 극장 예산이 늘어요</div><button class="abtn" id="abtn">A</button></div>
  </div>
  <div class="meter" id="meter"></div>
</section>

<!-- FINALE -->
<section class="view" id="finale"></section>
</div>

<script>
/* ================= UTIL ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cx2=c=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x};
const R=(x,a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
function grid(x,rows,pal,ox=0,oy=0,flip=false){const w=rows[0].length;rows.forEach((r,y)=>{for(let i=0;i<w;i++){const ch=r[i];if(pal[ch])R(x,ox+(flip?w-1-i:i),oy+y,1,1,pal[ch])}})}
function mk(w,h,cls){const c=document.createElement('canvas');c.width=w;c.height=h;c.className='px '+(cls||'');return c}
function circ(x,cx,cy,r,c){for(let y=-r;y<=r;y++)for(let X=-r;X<=r;X++)if(X*X+y*y<=r*r+r*.6)R(x,cx+X,cy+y,1,1,c)}
function toast(m,ms=2000){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),ms)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hex2rgb(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function rgb2hex(a){return'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}

/* ================= SOUND ================= */
let snd=true,AC=null;
function tone(f=660,d=.07,type='square',v=.045,slide=0){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={step:()=>tone(180,.03,'triangle',.02),coin:()=>{tone(988,.06);setTimeout(()=>tone(1319,.12),60)},sel:()=>tone(660,.06),
  ok:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.12),i*90)),bad:()=>tone(200,.18,'sawtooth',.03,.6),
  door:()=>tone(330,.2,'square',.04,2),pop:()=>tone(880,.05,'square',.04,1.5),fan:()=>tone(1200,.08,'triangle',.04,.7)};
const SAYS=['히히힛!','키키킥~','꺄르륵!','헤헤 ✦','간지러워!','우히히!'];
function laugh(){const pats=[[1100,1300,1050,1250,1000],[900,1200,950,1250],[1400,1200,1350,1150,1300,1100]];const pt=pats[Math.random()*pats.length|0];
  pt.forEach((f,i)=>setTimeout(()=>{tone(f,.075,'square',.05,.82);tone(f*1.5,.05,'triangle',.02,.9)},i*85));setTimeout(()=>tone(600,.12,'triangle',.03,2.2),pt.length*85)}
function floatSay(x,y,txt){const d=document.createElement('div');d.className='say';d.textContent=txt||SAYS[Math.random()*SAYS.length|0];d.style.left=x+'px';d.style.top=(y-20)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
$('#sndBtn').onclick=()=>{snd=!snd;$('#sndBtn').textContent=snd?'🔊':'🔇';if(BGM.gain)BGM.gain.gain.value=snd?.9:0;SFX.sel()};

/* ================= BGM (8-bit chiptune) ================= */
const BGM={timer:null,next:0,step:0,track:null,gain:null,nb:null};

const mf=n=>440*Math.pow(2,(n-69)/12);
function bgmInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  if(!BGM.gain){BGM.gain=AC.createGain();BGM.gain.gain.value=snd?.9:0;BGM.gain.connect(AC.destination);
   const n=AC.sampleRate*.4,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;BGM.nb=b}return true}catch(e){return false}}
function bn(type,f,t,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+d+.03)}
function bnz(t,d,v,hp){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=BGM.nb;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(BGM.gain);s.start(t);s.stop(t+d)}
function bgmTick(){const T=TRK[BGM.track];if(!T)return;const sp=60/T.bpm/4;
  while(BGM.next<AC.currentTime+.15){const t=BGM.next,st=BGM.step%16,bar=Math.floor(BGM.step/16)%4,root=T.roots[bar],ch=T.q[bar]?[0,3,7]:[0,4,7];
    const n=T.mel[bar][st];if(n){bn(T.lead,mf(n),t,sp*(T.lead==='triangle'?2.6:1.6),T.lead==='triangle'?.075:.032);if(T.lead==='square')bn('triangle',mf(n+12),t,sp,.012)}
    if(T.drums){if(st%4===0)bn('triangle',mf(root-12),t,sp*2.2,.11);if(st%8===6)bn('triangle',mf(root),t,sp*1.2,.08)}
    else if(st===0||st===8)bn('triangle',mf(root-12),t,sp*7,.07);
    if(T.arp&&st%2===1)bn('square',mf(root+24+ch[(st>>1)%3]),t,sp*.8,.012);
    if(!T.drums&&st%4===2)bn('sine',mf(root+24+ch[(st>>2)%3]),t,sp*3,.025);
    if(T.drums){if(st===0||st===8||(T.drums===2&&st===10)){bn('sine',140,t,.12,.22)}if(st===4||st===12)bnz(t,.09,.08,1800);if(st%2===0)bnz(t,.025,.025,7000)}
    BGM.next+=sp;BGM.step++}}
function bgmPlay(name){if(!bgmInit())return;if(BGM.track===name)return;BGM.track=name;BGM.step=0;BGM.next=AC.currentTime+.08;if(!BGM.timer)BGM.timer=setInterval(bgmTick,30)}

    <div style="margin-top:14px"><button class="btn" id="rwOk">${pieces>=4?'✨ 중앙 극장으로!':'계속 탐험하기 ▶'}</button></div></div>`;
  const rc=cx2($('#rwCv'));R(rc,0,0,24,30,'#140726');R(rc,1,1,22,28,'#fcd34d');R(rc,1,24,22,5,'#f59e0b');R(rc,4,5,16,2,'#fff');R(rc,4,10,10,2,'#b45309');R(rc,4,14,14,2,'#b45309');
  [0,0,0].forEach((_,i)=>R(rc,0,8+i*7,2,3,'#140726'));
  SFX.ok();const r=box.getBoundingClientRect();confetti(r.left+r.width/2,r.top+80,60);
  $('#rwOk').onclick=()=>{closeMG();// update hud
    $$('.slot').forEach((s,i)=>s.classList.toggle('got',i<pieces));
    setTimeout(()=>{$('#lt'+ai).querySelector('em').textContent=letter;$('#lt'+ai).classList.add('on');$('#mt'+ai).classList.add('done');tone(1046,.15,'square',.05)},300);
    for(let i=0;i<rw.fans;i++)setTimeout(()=>spawnFan(),300+i*250);
    const remain=4-pieces;$('#hint').innerHTML=remain?`좋아요! 조각이 <b style="color:#d9f99d">${remain}개</b> 남았어요<br>깃발 없는 건물을 찾아보세요`:'🎉 조각을 모두 모았어요!<br>중앙 <b style="color:#d9f99d">골든 티켓 극장</b>으로!';
    if(pieces>=4)toast('✨ 골든 티켓 극장 문이 열렸어요!',2600)}}
const FANC=['#f472b6','#60a5fa','#a3e635','#fbbf24','#f87171','#34d399','#c4b5fd','#fb923c'];
function spawnFan(){fans.push({x:GATE.dx+(Math.random()-.5)*20,y:GATE.dy+6,c:FANC[fans.length%FANC.length],t:Math.random()*60|0,h:0,v:null});fanCount=fans.length;
  $('#fanN').textContent=(myTheater?myTheater.aud:0)+fanCount*25;bump('#fanChip');SFX.fan()}

/* 3D tilt */
function tilt(el,max=10){el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
  el.style.transform=`rotateY(${px*max}deg) rotateX(${-py*max}deg) translateZ(6px)`;el.style.setProperty('--mx',(px+.5)*100+'%');el.style.setProperty('--my',(py+.5)*100+'%')});
  el.addEventListener('pointerleave',()=>el.style.transform='')}

/* confetti fx */
const FX=$('#fx'),fxx=FX.getContext('2d');let fxp=[],fxOn=false;
function confetti(x0=innerWidth/2,y0=innerHeight/3,n=80){FX.width=innerWidth;FX.height=innerHeight;const cols=['#d9f99d','#c4b5fd','#f9a8d4','#fcd34d','#8b5cf6','#fff'];
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*6;fxp.push({x:x0,y:y0,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,s:4+((Math.random()*3)|0)*2,c:cols[i%cols.length],l:70+Math.random()*40})}
  if(!fxOn){fxOn=true;(function f(){fxx.clearRect(0,0,FX.width,FX.height);fxp=fxp.filter(p=>p.l-->0);fxp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.98;fxx.fillStyle=p.c;fxx.fillRect(p.x|0,p.y|0,p.s,p.s)});
    if(fxp.length)requestAnimationFrame(f);else{fxOn=false;fxx.clearRect(0,0,FX.width,FX.height)}})()}}

/* ================= START ================= */
$('#goBtn').onclick=async()=>{bgmPlay('town');SFX.ok();const ir=$('#iris');ir.className='iris close';await sleep(700);
  $('#intro').classList.remove('on');$('#game').classList.add('on');ir.className='iris open';startTime=Date.now();gameRunning=true;loop();await sleep(800);ir.className='iris'};

/* ================= FINALE ================= */
async function finale(){gameRunning=false;bgmPlay('end');SFX.door();const ir=$('#iris');ir.className='iris close';await sleep(750);
  $('#game').classList.remove('on');const F=$('#finale');F.classList.add('on');scrollTo(0,0);
  F.innerHTML=`<div class="assemble" id="asm"><div class="msg" id="asmMsg">흩어진 티켓 조각을 맞추는 중…</div></div>`;ir.className='iris open';
  const asm=$('#asm');const pos=[[-160,-140],[160,-140],[-160,160],[160,160]];const ps=pos.map((p,i)=>{const d=document.createElement('div');d.className='piece';
    d.style.clipPath=['polygon(0 0,100% 0,100% 50%,50% 50%,50% 100%,0 100%)','polygon(0 0,100% 0,100% 100%,50% 100%,50% 50%,0 50%)','polygon(0 0,50% 0,50% 50%,100% 50%,100% 100%,0 100%)','polygon(50% 0,100% 0,100% 100%,0 100%,0 50%,50% 50%)'][i];
    d.style.transform=`translate(${p[0]}px,${p[1]}px) rotate(${(i-1.5)*60}deg)`;asm.appendChild(d);return d});
  await sleep(500);ps.forEach((d,i)=>{d.style.transition=`transform .8s cubic-bezier(.3,1.4,.5,1) ${i*.15}s`;d.style.transform='translate(0,0) rotate(0)';setTimeout(()=>tone(400+i*150,.1),i*150+500)});
  await sleep(1600);$('#asmMsg').textContent='✨ 골든 티켓 완성! ✨';SFX.ok();confetti(innerWidth/2,innerHeight/2.5,90);
  ps.forEach(d=>{d.style.transition='transform .9s ease-in, opacity .9s';d.style.transform='scale(1.4) rotateY(540deg)';d.style.opacity='0'});
  await sleep(1000);ir.className='iris';showResult()}

function showResult(){const code=LETTERS.join(''),T=TYPES[code],tp=tpal(code);
  const pct=AX.map(a=>{const A=SC[a.a],B=SC[a.b],s=A+B||1;return Math.round(A/s*100)});
  const opp=code.split('').map((l,i)=>l===AX[i].a?AX[i].b:AX[i].a).join('');
  const best=code.slice(0,3)+(code[3]==='J'?'P':'J'); // 계획/즉흥만 다른 짝꿍
  const secs=Math.round((Date.now()-startTime)/1000);
  const F=$('#finale');F.innerHTML=`
  <div style="text-align:center;color:#fff;margin-bottom:6px"><span class="kicker">GAME CLEAR · 나의 공연 MBTI</span></div>
  <div class="ticketStage"><div class="ticket" id="ticket"><div class="tface">
    <div class="holo"></div><div class="shine"></div><span class="notch l"></span><span class="notch r"></span><span class="perf"></span>
    <div class="tk-top"><span>GOLDEN TICKET</span><span>No.${String(Math.floor(Math.random()*9000)+1000)}</span></div>
    <div class="code">${code.split('').map((l,i)=>`<span style="background:${['#fcd34d','#c4b5fd','#f9a8d4','#d9f99d'][i]};animation-delay:${.2+i*.15}s">${l}</span>`).join('')}</div>
    <div class="tk-char" id="tkChar" title="틱키를 눌러보세요!"></div>
    <div class="tk-name">${T.e} ${T.n}</div>
    <div class="tk-one">${AX.map((a,i)=>code[i]===a.a?a.an:a.bn).join(' · ')}</div>
    <div class="tk-axes">${AX.map((a,i)=>`<div class="ax"><span class="${code[i]===a.a?'on':''}">${a.a} ${a.an.split('·')[0]}</span><div class="tr"><i data-w="${pct[i]}"></i></div><span class="${code[i]===a.b?'on':''}">${a.bn.split('·')[0]} ${a.b}</span></div>`).join('')}</div>
    <div class="tk-foot"><span>ADMIT ONE · TIX-AI</span><span>${new Date().toLocaleDateString('ko-KR')}</span></div>
  </div></div></div>
  <p style="text-align:center;color:var(--p300);font-family:Jua;font-size:13px;margin-top:10px">👆 티켓을 기울여 보고, 틱키를 콕 눌러보세요!</p>

  <div class="card rsec"><div class="rhead" style="color:var(--ink)"><span class="pix" style="color:#fff">TYPE</span>${code} 은 어떤 관객?</div>
    <div class="kw">${T.kw.map(k=>`<span>#${k}</span>`).join('')}</div><p class="desc">${T.d}</p>
    <div style="margin-top:12px;display:grid;gap:6px">${AX.map((a,i)=>{const p=code[i]===a.a?pct[i]:100-pct[i];return `<div style="font-size:13px"><b style="font-family:Jua">${code[i]===a.a?a.an:a.bn} ${p}%</b> · ${ZN[a.zone]}에서 확인했어요</div>`}).join('')}</div></div>

  <div class="rsec"><div class="rhead"><span class="pix">PICK</span>${TODAY.getMonth()+1}월, ${code}에게 추천하는 공연</div>
    <div class="card" id="recs"></div>
    <p style="color:var(--p300);font-size:11.5px;margin-top:8px;line-height:1.5">📅 ${TODAY.getFullYear()}.${String(TODAY.getMonth()+1).padStart(2,'0')}.${String(TODAY.getDate()).padStart(2,'0')} 기준 · 지금 공연 중이거나 45일 안에 개막하는 작품만 골랐어요${LIVE.length?' · KOPIS 실시간 데이터 반영':''}</p></div>

  <div class="rsec"><div class="rhead"><span class="pix">MATCH</span>관객 궁합</div>
    <div class="match"><div class="card" id="mBest"><small>BEST 동행</small></div><div class="card" id="mOpp"><small>정반대 취향</small></div></div></div>

  <div class="rsec"><div class="rhead"><span class="pix">LOG</span>나의 모험 기록</div>
    <div class="log"><div>🏛️ 내가 지은 극장<b>${LOG.theater} (${myTheater.big?'환상 극장':'현실 극장'})</b></div><div>🧪 내가 만든 포션<b>${LOG.potion}</b></div>
      <div>🎤 합격시킨 배우<b>${LOG.hires.slice(0,2).join(', ')} 외</b></div><div>👣 걸음 · 🪙 코인<b>${P.steps*4}걸음 · ${coins}/8개</b></div>
      <div>👥 모은 관객<b>${((myTheater?myTheater.aud:0)+fans.length*25).toLocaleString()}명</b></div><div>⏱️ 플레이 시간<b>${Math.floor(secs/60)}분 ${secs%60}초</b></div></div></div>

  <div class="rsec"><div class="rhead"><span class="pix">16</span>공연 MBTI 도감</div><div class="dex" id="dex"></div></div>

  <div class="actions"><button class="btn wh" id="copyBtn">🔗 결과 복사</button><button class="btn" id="againBtn">↻ 다시 플레이</button></div>
  <div class="foot">추천 공연은 방문한 날짜 기준으로 자동으로 바뀌어요 · 공연 정보: KOPIS 공연예술통합전산망 · 각 공식 예매처<br>캐릭터와 일러스트는 모두 오리지널 픽셀 아트예요.<br>틱키의 잃어버린 티켓 · Inspired by <a href="https://tixtory.joripspace.run/" target="_blank" rel="noopener">TIXTORY</a></div>`;
  F.querySelector('#tkChar').appendChild(tk16(tp,code));$('#tkChar').onclick=e=>{laugh();const cv=$('#tkChar canvas');cv.classList.remove('hop');void cv.offsetWidth;cv.classList.add('hop');floatSay(e.clientX,e.clientY)};
  const tk=$('#ticket');tilt(tk,14);tk.animate([{transform:'rotateY(-180deg) scale(.6)',opacity:0},{transform:'rotateY(15deg) scale(1.03)',opacity:1,offset:.7},{transform:'none'}],{duration:1100,easing:'cubic-bezier(.2,1,.3,1)'});
  setTimeout(()=>$$('.ax .tr i').forEach(i=>i.style.width=i.dataset.w+'%'),700);
  // recs
  const RECS=getRecs(code);
  if(!RECS.length)$('#recs').innerHTML='<p style="font-size:14px;line-height:1.6">지금 추천할 수 있는 공연 정보를 업데이트하고 있어요. 곧 새로운 공연으로 찾아올게요! 🎫</p>';
  RECS.forEach(s=>{const d=document.createElement('div');d.className='rec';
    if(s.poster){const im=document.createElement('img');im.src=s.poster;im.alt=s.title+' 포스터';im.loading='lazy';im.className='poster';im.onerror=()=>im.replaceWith(pixIcon(s));d.appendChild(im)}else d.appendChild(pixIcon(s));
    const stc=s.st.k==='end'?'#f43f5e':s.st.k==='soon'?'#f59e0b':'#16a34a';
    d.insertAdjacentHTML('beforeend',`<div><span class="gtag">${GLABEL[s.genre]||'공연'}</span> <span class="gtag" style="background:${stc};color:#fff">${s.st.txt}</span><b>${s.title}</b><small>${period(s)}<br>${s.venue}${s.region?' · '+s.region:''}</small><small style="color:#7c3aed;margin-top:3px">✨ ${whyLine(s,code)}</small><a href="${s.url}" target="_blank" rel="noopener">🎟️ ${s.booking?s.booking+'에서 ':''}예매하기 ↗</a></div>`);$('#recs').appendChild(d)});
  function pixIcon(s){const c=mk(16,16),x=cx2(c),gc=GCOL[s.genre]||GCOL.musical;for(let y=0;y<16;y++)R(x,0,y,16,1,y<8?gc[0]:gc[1]);for(let i=0;i<5;i++)R(x,(i*7)%16,(i*5)%8,1,1,'#fff');grid(x,TK,tp,2,3);return c}
  const mcard=(id,c)=>{const el=$(id);el.appendChild(tk16(tpal(c),c));el.insertAdjacentHTML('beforeend',`<b>${TYPES[c].n}</b><em>${c}</em>`);el.onclick=()=>openDex(c)};mcard('#mBest',best);mcard('#mOpp',opp);
  Object.keys(TYPES).forEach(c=>{const d=document.createElement('div');if(c===code)d.className='me';d.appendChild(tk16(tpal(c),c));d.insertAdjacentHTML('beforeend',`<b>${c}</b>`);d.onclick=()=>openDex(c);$('#dex').appendChild(d)});
  $('#copyBtn').onclick=()=>{const txt=`🎫 나의 공연 MBTI는 ${code} "${T.n}"!\n${AX.map((a,i)=>code[i]===a.a?a.an:a.bn).join(' · ')}\n추천 공연: ${RECS.map(r=>r.title).join(', ')}\n#틱키의잃어버린티켓 #공연MBTI`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('📋 결과가 복사됐어요!')).catch(()=>toast('복사에 실패했어요'))};
  $('#againBtn').onclick=()=>location.reload();
  SFX.ok();setTimeout(()=>confetti(innerWidth/2,innerHeight/3,120),600)}

function openDex(c){const t=TYPES[c];SFX.sel();$('#sheetIn').innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px" id="dxh"></div>
  <div class="kw">${t.kw.map(k=>`<span>#${k}</span>`).join('')}</div><p class="desc">${t.d}</p>
  <div style="margin-top:10px;display:grid;gap:6px">${getRecs(c).map(r=>`<a href="${r.url}" target="_blank" rel="noopener" style="font-family:Jua;color:#5b21b6;text-decoration:none">🎟️ ${r.title} <small style="color:#6b5a86">· ${GLABEL[r.genre]} · ${r.st.txt}</small></a>`).join('')}</div>
  <button class="btn sm" style="margin-top:12px" onclick="$('#sheet').classList.remove('on')">닫기</button>`;
  const h=$('#dxh'),cv=tk16(tpal(c),c);cv.style.cssText='width:64px;height:64px';h.appendChild(cv);h.insertAdjacentHTML('beforeend',`<div><span class="pix" style="font-size:12px;color:#7c3aed">${c}</span><div style="font-family:Jua;font-size:22px">${t.e} ${t.n}</div></div>`);
  $('#sheet').classList.add('on')}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')};
</script>
